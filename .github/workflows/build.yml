# Builds every plugin and runs its tests - the testkit's PluginContract included - on every push and pull request.
name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: build
        run: ./gradlew build sha256
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-jars
          path: |
            plugins/*/build/libs/*.jar
            plugin-template/build/libs/*.jar
          retention-days: 30
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            plugins/*/build/reports/
            plugin-template/build/reports/
          retention-days: 7
